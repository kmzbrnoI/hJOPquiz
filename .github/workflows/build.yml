name: Build pdf

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-czechslovak texlive-fonts-recommended texlive-fonts-extra texlive-latex-recommended texlive-latex-extra texlive-extra-utils

      - name: Build pdf
        run: make

      - name: Upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: '*.pdf'
